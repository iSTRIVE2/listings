.Header_nav{display:flex;flex-wrap:wrap;padding:12px 30px}.Header_nav a,.Header_nav .dd>span{display:block;padding:6.4px 16px;font-size:16px;line-height:24px;text-transform:uppercase;color:#a0a0a0;position:relative;cursor:pointer}.Header_nav a:hover,.Header_nav .dd:hover>span{color:#000}.Header_nav a.cur{color:#000;font-weight:700}.Header_nav a.cur:before,.Header_nav a.cur:after{content:"";position:absolute;top:50%;width:12px;height:2px;background:var(--green)}.Header_nav a.cur:before{left:2px}.Header_nav a.cur:after{right:2px}
.Header_nav .dd{position:relative}.Header_nav .dd .menu{display:none;position:absolute;top:100%;left:0;background:#ebe9ef;border:1px solid #ddd;min-width:140px;z-index:30}.Header_nav .dd:hover .menu{display:block}.Header_nav .dd .menu a{padding:8px 16px}
.wrap{max-width:1240px;margin:0 auto;padding:0 30px}.page{max-width:992px;margin:0 auto;padding:60px 30px}.page h1{font-size:36px;font-weight:400;line-height:1.2;margin:0 0 24px}.page h2{font-size:24px;font-weight:400;margin:28px 0 10px}.page h3{font-size:22px;font-weight:400;margin:24px 0 8px}.page p{margin:0 0 16px}.page img{display:block;margin:10px 0}
/* home */
.slider{position:relative;height:calc(100vh - 70px);min-height:420px;background:#222;overflow:hidden}.slider .sl{position:absolute;inset:0;opacity:0;transition:opacity .9s;background:center/cover no-repeat}.slider .sl.on{opacity:1}.slider .ov{position:absolute;inset:0;background:rgba(0,0,0,.35)}.slider .desc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-align:left;text-shadow:0 1px 6px rgba(0,0,0,.6)}.slider .desc b{display:block;font-size:34px;font-weight:400}.slider .desc span{font-size:22px}
.slider .arr{position:absolute;top:50%;transform:translateY(-50%);width:70px;height:70px;color:#fff;font-size:44px;display:grid;place-items:center;cursor:pointer;z-index:2;user-select:none}.slider .arr.l{left:0}.slider .arr.r{right:0}
.sec{position:relative;min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:#7a7a7a center/cover no-repeat;padding:60px 30px}.sec:nth-child(even){background-color:#555}.sec .ov{position:absolute;inset:0;background:rgba(0,0,0,.35)}.sec>*{position:relative}.sec h2{font-size:34px;font-weight:400;line-height:1.3;max-width:900px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}.sec p{font-size:20px;margin:0 0 26px;text-transform:uppercase;letter-spacing:.5px}.sec .btn{font-size:20px;padding:12px 24px}
.btn{display:inline-block;background:var(--green);color:#fff;padding:9px 18px;border:0;cursor:pointer;text-transform:uppercase}.btn:hover{filter:brightness(.95)}
.testi{background:#fff;padding:60px 30px}.testi .in{max-width:992px;margin:0 auto}.testi blockquote{margin:0 0 34px;font-size:17px;line-height:1.6}.testi blockquote footer{margin-top:8px;color:var(--grey);font-size:15px}.testi blockquote footer b{color:var(--ink);font-weight:600;display:block}
/* team */
.Team_photos{background:#fff;padding:24px 16px}.Team_grid{max-width:745px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.Team_item{position:relative;width:auto;height:auto;aspect-ratio:1;background:#fff center/cover no-repeat;display:block}.Team_item .body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.7);color:#fff;opacity:0;transition:opacity .2s;padding:22px 12px;text-align:center;text-transform:uppercase}.Team_item:hover .body{opacity:1}.Team_item .nm{font-size:19px}.Team_item .rl{font-size:13px;margin-top:3px;color:var(--green)}.Listings_item_join_inner{transition:transform .25s ease}.Listings_item--join:hover .Listings_item_join_inner{transform:rotate(12deg) scale(.86)}.Join{background:linear-gradient(#6f6f6f,#a3a3a3);padding:140px 16px}.Join_inner{max-width:992px;margin:0 auto;display:flex;background:#fff}.Join .Contact_form{flex:0 0 55%}.Join_side{flex:1;background:#b5b5b5;color:#fff;padding:50px 44px;font-size:18px;line-height:1.42;text-align:justify;text-align-last:center}.Join_side p{margin:0 0 38px}.Join_side a{color:#fff;font-weight:700;text-decoration:underline}.Join_file{display:flex;align-items:center;gap:14px;margin:8px 0;color:#9a9a9a;font-size:16px}.Join .Contact_form .Join_file input{border:0;width:auto;margin:0;font-size:13px}.Join_fine{font-size:13px;color:#9a9a9a;line-height:1.7;margin-bottom:14px}@media(max-width:800px){.Join{padding:30px 12px}.Join_inner{flex-direction:column}}.Team_item.join{display:block;background:#fff;text-decoration:none}.Team_item.join .jt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--green);color:#fff;font-size:38px;font-weight:600;line-height:1.05;text-transform:uppercase;text-align:center;transform:scale(.87);transition:transform .28s ease}.Team_item.join:hover .jt,.Team_item.join:focus .jt{transform:rotate(12deg) scale(.94)}.Team_item.join .b{display:none}.Team_item.join:hover .a,.Team_item.join:focus .a{display:none}.Team_item.join:hover .b,.Team_item.join:focus .b{display:inline}@media(max-width:700px){.Team_grid{grid-template-columns:repeat(2,1fr)}.Team_item.join .jt{font-size:26px}}
.Bios{background:#dcdcdc;padding:24px max(16px,calc(50% - 400px))}.Bio{display:flex;gap:22px;padding:24px;margin:0 0 18px;background:#fff}.Bio .bd{flex:1;min-width:0}.Bio .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.Bio .pic{flex:0 0 298px}.Bio .pic img,.Bio .pic .ph{width:298px;height:298px;max-width:100%;object-fit:cover;background:#e1e2e6;display:block}.Bio .nm{font-size:22px;text-transform:uppercase;color:var(--green)}.Bio .rl{margin:6px 0 18px;line-height:1.5}.Bio .rl a{color:inherit;text-decoration:none}.Bio .ic{display:flex;gap:10px;flex:none}.Bio .ic a{display:block;width:26px;height:26px}.Bio .ic svg{width:26px;height:26px;fill:var(--green)}.Bio .ic a:hover svg{opacity:.75}.Bio .tx{white-space:pre-wrap}
/* listings (same as strivere.com/listings) */
.ListingsHead{padding:60px 0 30px}.ListingsHead_title{font-size:36px;line-height:1.2;text-align:center;text-transform:uppercase;margin:0 0 15px}.ListingsHead_toggle{display:flex;justify-content:center}.ListingsHead_toggle_btn{background:var(--green);color:#fff;border:0;font-size:22px;text-transform:uppercase;padding:12px 22.5px;cursor:pointer}
.Filter{display:none;max-width:650px;margin:0 auto;padding-top:14px}.Filter.on{display:block}.Filter_types{display:flex;justify-content:center;gap:48px;padding-bottom:10px;border-bottom:1px solid var(--green);text-align:center}.Filter_types label{display:block;font-size:13px;text-transform:uppercase;cursor:pointer}.Filter_types input{margin:0 6px 0 0;vertical-align:-1px}
.Filter_nums{display:flex;justify-content:center;gap:10px;padding-top:14px}.Filter_nums label{font-size:13px;display:block}.Filter_nums input{display:block;width:90px;height:30px;border:1px solid var(--line);padding:0 8px;font:inherit;font-size:13px;margin-top:3px}

.Listings_item{position:relative;display:block;width:390px;margin:0 0 5px;padding:20px 0;border:1px solid rgba(0,0,0,.2);box-shadow:6px 5px 10px 0 rgba(0,0,0,.2);background:#fff;color:var(--ink2);text-align:center}

.Listings_item_body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;background:rgba(0,0,0,.7);color:#fff;padding:22.5px 7.5px;opacity:0;transition:opacity .2s}.Listings_item:hover .Listings_item_body{opacity:1}.Listings_item_body .Listings_item_name{white-space:normal}
.Listings_item_info{margin-top:4.5px}.Listings_item_more{margin-top:15px;color:var(--green);text-transform:uppercase}.Listings_item_more+.Listings_item_more{margin-top:5px}
.Listings_item--join{display:flex;align-items:center;justify-content:center;padding:20px}.Listings_item_join_inner{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:300px;background:var(--green);color:#fff;font-size:46px;line-height:1.05;text-transform:uppercase}
.Listings_empty{width:100%;text-align:center;padding:60px 0;color:var(--grey)}
.Property_head{background:#dadada;padding:30px 0}.Property_head_back{max-width:1100px;margin:0 auto 7.5px;padding:0 30px}.Property_head_back a{color:var(--blue)}.Property_head_back svg{width:15px;height:15px;vertical-align:-2px;margin-right:7.5px}
.PropertyHero{max-width:1100px;margin:0 auto;background:#fff;padding:30px;display:flex}.PropertyHero_media{width:660px;flex:0 0 660px}.PropertyHero_info{flex:1;margin-left:30px;padding-left:30px;border-left:1px solid var(--green);font-size:17px;line-height:1.5}

.paginationWrapper{display:flex;justify-content:center;margin:10px}.paginationButton{width:11px;height:11px;border-radius:50%;background:#dadada;border:0;border-bottom:2px solid rgba(0,0,0,.05);padding:0;margin:5px;cursor:pointer}.paginationButton.active{background:var(--green)}
.PropertyContactList{display:flex;flex-wrap:wrap;margin-top:20px}.PropertyContact{width:50%;text-align:center;margin-top:15px}.PropertyContact_img{width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;background:#dadada}.PropertyContact_name{font-size:16px;color:var(--green);text-transform:uppercase}.PropertyContact_phone{color:var(--grey);margin-bottom:15px}.PropertyContact_btn{display:inline-block;background:var(--green);color:#fff;padding:7.5px 22.5px 4.5px}

/* contact */

.Contact_side{flex:0 0 466px;background:#e5e3df;padding:30px}.Office{margin-bottom:22px}.Office b{display:block;font-size:17px;font-weight:600}.Office div{white-space:pre-line}.Office a{color:var(--blue)}.Contact_map{height:220px;margin-top:10px}.Contact_map iframe{width:100%;height:100%;border:0}
.Footer{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;background:#202124;color:#fff;padding:30px 0;text-align:center}.Footer a{display:block;padding:0 5px}.Footer a+a:before{content:"| "}.Footer .fine{width:100%;color:#aaa;font-size:12px;margin-top:8px}
.empty{max-width:992px;margin:0 auto;padding:80px 30px;text-align:center;color:var(--grey)}
@media(max-width:1300px){.Listings_item{width:calc(33.333% - 10px)}.Listings_list:after{flex-basis:calc(33.333% - 10px)}}
@media(max-width:1000px){.Listings_item{width:calc(50% - 8px)}.Listings_list:after{display:none}.PropertyHero{flex-direction:column}.PropertyHero_media{width:auto;flex:none}.PropertyHero_info{margin:30px 0 0;padding:30px 0 0;border-left:0;border-top:1px solid var(--green)}.Contact_inner,.News,.Bio{flex-direction:column}.Contact_side{flex:none}.News_tabs{flex:none;display:flex;overflow:auto}.News_tabs button{width:auto}}
@media(max-width:640px){.Header{height:auto;flex-direction:column;align-items:flex-start}.Header_nav{padding:0 14px 10px}.Header_nav a,.Header_nav .dd>span{padding:6px 8px;font-size:13px}.Listings_item{width:100%}.ListingsHead_title,.page h1{font-size:28px}.Filter_types{flex-direction:column;gap:10px}.PropertyContact{width:100%}.sec h2{font-size:24px}.slider .desc b{font-size:26px}.Team_item{width:100%;height:auto;aspect-ratio:1}}

com","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50697/Bryan%20Cropped%20Website_XPZVa.jpg"}],"updated":"2026-11-11T19:33:05.234Z"},{"id":"pro_wsbmoore201industrialblvd","name":"WSB Moore","address":"201 Industrial Blvd","city":"Moore","state":"OK","zip":"73160","lat":30.578159,"lng":-98.291913,"kind":"single","type":"STNL","product":"Industrial","status":"Available","sold":false,"price":"$900,000","priceNum":900000,"cap":9.94956,"noi":89546.04000000001,"occ":100,"sf":6000,"acres":0.69,"yearBuilt":2000,"units":null,"leaseType":"NN","tenant":"WSB (Moore R&D Lab)","soldDate":"","soldPrice":null,"description":"","highlights":[],"photos":[],"om":null,"flipbook":"","video":"","featured":false,"slider":false,"agents":[{"name":"Bryan Meyer","first":"Bryan","phone":"(913) 221-7957","email":"bmeyer@strivere.com","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50697/Bryan%20Cropped%20Website_XPZVa.jpg"}],"updated":"2026-11-11T19:33:05.234Z"}],"team":[{"id":"mem_jenniferpierson","name":"Jennifer Pierson","role":"Founder","bio":"Ms. Pierson began her career in Arizona while completing her degree in Real Estate Finance at Arizona State University. She went on to spend 21 years as an investment sales professional at CBRE, where she was named Rookie of the Year in her first year and subsequently ranked as a Top 20 Producer in Dallas/Fort Worth in virtually every year that followed. Nationally, she earned recognition as a Top 200 Producer and as a member of the Colbert Coldwell Circle—an honor reserved for the top one percent of sales professionals firmwide.\n\nFrom 2010 to 2013, Ms. Pierson was selected to lead CBRE’s United States Private Capital Investment Group, with more than 300 brokers across the country reporting to her. She led the platform while simultaneously maintaining her own investment sales practice, exceeding performance expectations in recruiting and revenue growth and remaining among the firm’s most productive brokers.\n\nIn 2015, Ms. Pierson fulfilled a long-held ambition by founding her own retail investment firm, Pierson Retail Advisors, created to help property owners and investors achieve maximum value in the disposition of their commercial real estate assets. The platform evolved into STRIVE, which today is a meaningful force across the DFW and Houston marketplaces, transacting in industrial, office, retail, and multifamily product types throughout the state of Texas.\n\nOutside of her professional life, Ms. Pierson is an avid skier, painter, and traveler, and treasures time spent with family and friends. She resides in Dallas with her husband, Mark, and together they have six children.","email":"jpierson@strivere.com","phone":"(214) 354-6820","linkedin":"https://www.linkedin.com/in/jennifer-pierson-743083b/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50602/Jennifer%20Blurred%20Offic_tIF6V.jpg"},{"id":"mem_jakedutson","name":"Jake Dutson","role":"Partner","bio":"Jake Dutson serves as a Partner and the Houston Market Leader for STRIVE, leveraging over six years of specialized experience in retail investment property sales across Texas. His role involves sourcing investment opportunities, overseeing ownership transitions, and leading marketing efforts for multi-tenant shopping centers and single-tenant net-leased retail buildings. Jake and his team of agents in Houston work in unison with the firm’s Dallas office to provide their clients with real-time insights and exposure to the Texas marketplace.\n\nSince 2019, Jake has advised clients in the sale of over $200 million in total consideration. He has been recognized as a \"Top Power Broker\" in Dallas Magazine's CEO Edition and received the \"Heavy Hitter\" title in CRE Investment from the Houston Business Journal in 2023. Additionally, in 2023, he was nominated for the Houston Emerging Leader of the Year Award by REDnews. Jake's enthusiastic commitment to diligence, hard work, and growth has contributed to STRIVE's prominence in the Houston retail investment sales sector.\n\nJake grew up in Tucson, Arizona with his twin brother and two older sisters. He spent eight years of his childhood abroad, living on four continents in countries such as Indonesia, Macedonia, and Venezuela. A graduate of the University of Arizona in 2017, Jake earned degrees in Economics and Finance while working as an intern for Mid-America Real Estate in Chicago, IL his senior year. Jake moved to Texas immediately after college to join STRIVE at its inception.","email":"jdutson@strivere.com","phone":"(520) 241-5744","linkedin":"https://www.linkedin.com/in/jakedutson/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50625/Jake%20Cropped.jpg"},{"id":"mem_bryanmeyer","name":"Bryan Meyer","role":"Partner","bio":"Bryan Meyer joined STRIVE in 2023 and specializes in advising clients in the acquisition and disposition of industrial assets. Bryan has over 15 years in Industrial Sales, Business Development, and Management Experience. Bryan won numerous sales awards before transitioning into a business development and consulting role for industrial plants across the country.\n\nBryan played collegiate basketball for four years before graduating magna cum laude from Rockhurst University with a Bachelors in Business Management. Bryan also earned his Juris Doctorate, with an emphasis in Business and Entrepreneurial Law from University of Missouri – Kansas City.","email":"bmeyer@strivere.com","phone":"(913) 221-7957","linkedin":"https://www.linkedin.com/in/bryan-meyer-4592829b/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50697/Bryan%20Cropped%20Website_XPZVa.jpg"},{"id":"mem_andrewrobeson","name":"Andrew Robeson","role":"Associate","bio":"Andrew Robeson specializes in the acquisition and disposition of single and multi-tenant office investment assets in the DFW market. Prior to STRIVE, Andrew previously interned at CBRE in the Northwest Arkansas office where he worked closely with the tenant and landlord rep teams and gained experience in commercial real estate. Andrew graduated from the University of Arkansas with a bachelor’s degree in Finance and Real Estate Investments where he was a member of Phi Delta Theta.\n\nAndrew is originally from Little Rock, Arkansas. Outside of the office, Andrew enjoys spending time with family and friends, traveling, running, cycling, and cheering on the Razorbacks.","email":"arobeson@strivere.com","phone":"(501) 813-7144","linkedin":"https://www.linkedin.com/in/andrew-robeson-1a551a187/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50676/Robo%20cropped.jpg"},{"id":"mem_michaelhill","name":"Michael Hill","role":"Associate","bio":"Michael specializes in advising clients in the acquisition and disposition of multi-tenant retail assets in Houston and the surrounding areas. Michael graduated cum laude from Cornell University with a Bachelor of Science in Biomedical Engineering. During his time there, he spent time volunteering as a youth football coach and was a member of Phi Gamma Delta.\n\nHe was born and raised and has spent most of his life living in Houston. Prior to joining STRIVE, Michael worked as a consultant at a financial technology company in Houston. He enjoys playing basketball, spending time with family and friends, and volunteering with the Houston Livestock Show & Rodeo.","email":"mhill@strivere.com","phone":"(832) 516-1964","linkedin":"https://www.linkedin.com/in/michael-hill-638954162/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50678/Michael%20Cropped.png"},{"id":"mem_hudsonspringer","name":"Hudson Springer","role":"Associate","bio":"Hudson Springer joined STRIVE in June of 2023. He specializes in single and multi-tenant industrial investment sales in DFW. Hudson previously worked for a small residential real estate firm under their top producer. Here, he helped with managing customer relations and contacting new leads. He graduated from the University of Arkansas and earned a bachelor’s degree in marketing while also maintaining his position as Head of Recruitment at the KAAO chapter.\n\nHudson grew up in the Austin area and played basketball and won a state championship in tennis. He enjoys traveling, spending time with loved ones, and BBQ.","email":"hspringer@strivere.com","phone":"(512) 940-0160","linkedin":"https://www.linkedin.com/in/hudson-springer-790947196/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50692/Hudson%20Cropped.png"},{"id":"mem_harrisonbeethe","name":"Harrison Beethe","role":"Associate","bio":"Harrison Beethe specializes in advising clients on the acquisition and disposition of Multi-Tenant Retail assets in the state of Texas. Prior to joining STRIVE, Harrison spent 3 years playing minor league baseball in the Kansas City Royals Organization as a right-handed pitcher. Harrison graduated from Texas Christian University with a bachelor’s degree in Communication Studies with a focus on Business. While at TCU, Harrison was a member of the baseball team, as well as the TCU Real Estate Club.\n\nHarrison was born and raised in Fort Worth, Texas. In his free time, Harrison loves to play golf, cheer on all Dallas area sports teams, workout, and spend time with friends and family.","email":"hbeethe@strivere.com","phone":"(817) 449-3301","linkedin":"https://www.linkedin.com/in/harrison-beethe-412837123/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50700/use_b99bK.png"},{"id":"mem_maxmarion","name":"Max Marion","role":"Associate","bio":"Max Marion specializes in advising clients on the acquisition and disposition of single and multi-tenant industrial investment assets in the Houston Market. Max graduated from Florida State University with a degree in economics and a minor in commercial entrepreneurship. During his time there he was a member of Kappa Alpha Order.\n\nOriginally from Atlanta, Max enjoys running, hanging out with friends and family, watching sports, as well as volunteering at the Houston Livestock Show and Rodeo, where he is a member of the Breeder Greeters committee.","email":"mmarion@strivere.com","phone":"(404) 924-5155","linkedin":"https://www.linkedin.com/in/max-marion-a54a11152/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50706/Max%20Cropped.png"},{"id":"mem_connorjabbar","name":"Connor Jabbar","role":"Associate","bio":"Connor Jabbar specializes in advising clients on the acquisition and disposition of Single-Tenant assets in Texas. Connor graduated from Texas Christian University in May 2023 with a BA in Finance with an emphasis in Real Estate. He was a member of the TCU Sales Program and the Lambda Chi Alpha fraternity. Connor previously work at Morgan Stanley in Silicon Valley as an Asset Management intern. After graduation, he worked in Ops and Capital Markets at Charles Schwab as a full-time analyst.\n\nConnor grew up in San Diego, California. In his free time, he enjoys playing golf, working out, eating at various restaurants and pretty much any outdoor activity. He also loves spending time with his friends and family and watching every single TCU Horned Frogs, San Diego Padres, and LA Chargers game (they are still in San Diego in his heart).","email":"cjabbar@strivere.com","phone":"(858) 888-0325","linkedin":"https://www.linkedin.com/in/connor-jabbar-0b0102195/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50712/use.png"},{"id":"mem_justinshearer","name":"Justin Shearer","role":"Associate","bio":"Justin Shearer specializes in advising clients on the acquisition and disposition of Multi-Tenant Retail assets across Texas, with a focus on the Greater Houston area. He graduated from the University of Colorado in December of 2024 with a degree in Strategic Entrepreneurship and Business Management. During his time at Colorado, Justin was an active member of the Kappa Sigma fraternity.\n\nThroughout college, Justin worked at Champions School of Real Estate, where he gained valuable experience supporting real estate education and licensing.\n\nJustin grew up in The Woodlands, Texas. In his free time, he enjoys skiing, fishing, and cheering on all of Houston’s sports teams. He’s passionate about building relationships and delivering results for his clients.","email":"jshearer@strivere.com","phone":"(832) 948-3237","linkedin":"https://www.linkedin.com/in/justin-shearer-959533275/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50715/Justin%20Cropped.jpg"},{"id":"mem_ilgizvaliev","name":"Ilgiz Valiev","role":"Associate","bio":"Ilgiz Valiev specializes in advising clients on the acquisition and disposition of industrial investment properties, with a focus on delivering strategic, results-driven solutions for owners and investors.\n\nHe graduated from Texas Tech University in 2022. During his time in college, Ilgiz competed as a collegiate tennis player and continued on to play professional tennis, developing a strong foundation in discipline, performance, and competitive strategy that he brings into his real estate career.\n\nOutside of work, Ilgiz enjoys staying active in sports and spending time with his wife, Kelly, and their dog, Remy. He is passionate about building long-term relationships and creating value for his clients through thoughtful execution and market insight.","email":"ivaliev@strivere.com","phone":"(806) 407-7795","linkedin":"https://www.linkedin.com/in/ilgiz-valiev-0516771a0/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50716/Ilgiz%20cropped.jpg"},{"id":"mem_edwardschwarz","name":"Edward Schwarz","role":"Associate","bio":"Eddie Schwarz joined STRIVE in 2025, where he specializes in advising clients on the acquisition and disposition of industrial assets.\n\nEddie holds a Bachelor’s degree in Construction Management and Environmental Design from the University of Oklahoma. Where he was a member of Sigma Phi Epsilon. Before transitioning to commercial real estate, he spent five years managing major highway construction projects throughout the Houston area.\n\nEddie was born and raised in the Houston area. In his free time, he enjoys spending time with his wife, Elissa, family, and friends; cheering on Houston sports teams and his Oklahoma Sooners; and pursuing hobbies like golf, skiing, and traveling. He is passionate about building relationships throughout the community, and bringing value to his clients.","email":"eschwarz@strivere.com","phone":"(281) 704-2059","linkedin":"https://www.linkedin.com/in/eddie-schwarz-717b31138/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/65694/Eddie%20cropped.jpg"},{"id":"mem_caseyrussell","name":"Casey Russell","role":"Executive Assistant","bio":"Casey Russell is the Executive Assistant to Jennifer Pierson at STRIVE Real Estate, where she supports the day-to-day of the business and ensures a seamless experience throughout. Known for her discretion, attention to detail, and intuitive approach, she helps create a seamless and polished experience behind the scenes.\n\nWith over a decade of experience in real estate, Casey began her career in residential with Dave Perry-Miller Real Estate, where she was a consistently top-performing agent. During that time, she was recognized as a D Magazine Top Producer from 2016–2023, a member of the companywide #1 group, and a top producer within her office.\n\nShe brings a thoughtful, service-driven mindset to everything she does, with a natural ability to anticipate needs and execute at a high level.\n\nOutside of work, Casey enjoys traveling, discovering new restaurants, and spending time with family, friends, and her dog, Charles.","email":"crussell@strivere.com","phone":"(214) 532-4420","linkedin":"https://www.linkedin.com/in/casey-russell-512811304/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/306580/Casey%20website_iCCvk.png"},{"id":"mem_stevebelli","name":"Steve Belli","role":"Senior Vice President","bio":"Steve Belli, a real estate professional with extensive experience, is a Senior Vice President with Strive RE. Belli oversees investment sales for medical and office properties as well as other commercial projects.\n\nPrior to joining Strive, Steve's commercial real estate experience included work with institutional office building brokerage, acquisitions and dispositions, portfolio underwriting, equity/debt formation, medical/office development, and property management with firms including CBRE, America Development & Investments, Ltd./ US Memory Care Ltd., Millennium Office Management, Evergreen Realty Interests, and others. Steve earned his BA in Economics and Finance from the University of Texas at Dallas.\n\nSteve was born and raised in Dallas and is married with three girls. Outside the office he enjoys playing golf, cooking and being with his friends and family.","email":"sbelli@strivere.com","phone":"(214) 212-2373","linkedin":"","photo":"https://strivenext.s3.amazonaws.com/website/contacts/309408/Steve%20Website%20Cropped_x19fX.jpg"},{"id":"mem_marklatham","name":"Mark Latham","role":"Managing Partner","bio":"Mark Latham is a 35-year veteran of the commercial real estate industry, bringing a depth of experience that spans brokerage, investment, and development. Early in his career, he founded Tarren Commercial, an office tenant representation firm that operated successfully throughout the 1980s and 1990s.\n\nOver the years, Mark has built a diverse track record that includes acquiring and selling businesses, developing and repositioning commercial properties, and investing in large portfolios of commercial paper secured by single-family assets. His broad perspective across multiple facets of the industry gives him a unique ability to identify opportunities and create value.\n\nKnown for his natural ability to teach and mentor, Mark is passionate about sharing his knowledge and helping others succeed. Despite a career filled with accomplishments, he remains characteristically humble—preferring to let his work speak for itself.\n\nMark is a valued member of the STRIVE team and a trusted resource to clients and colleagues alike.","email":"mlatham@strivere.com","phone":"(214) 616-9595","linkedin":"","photo":"https://strivenext.s3.amazonaws.com/website/contacts/309406/use_y0Iju.png"},{"id":"mem_chriscatinis","name":"Chris Catinis","role":"Associate","bio":"Chris Catinis joined STRIVE in 2025, where he specializes in advising clients on the acquisition and disposition of industrial assets. He earned his Bachelor’s degree in Finance from Tulane University in May 2025, where he was a member of the Kappa Alpha Order.\n\nChris was born and raised in New Orleans, Louisiana. In his free time, he enjoys traveling, trying new things, and spending time with those closest to him. He is also an avid sports fan who enjoys cheering on the New Orleans Saints, New Orleans Pelicans, and the Tulane Green Wave. He is dedicated to building strong relationships throughout the community and providing value to his clients.","email":"ccatinis@strivere.com","phone":"(504) 487-1426","linkedin":"https://www.linkedin.com/in/christopher-catinis-94b270238/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/63064/Screenshot%202026-08-20%20160306.png"},{"id":"mem_jacquigreen","name":"Jacqui Green","role":"Senior Vice President","bio":"Jacqueline brings more than 20 years of commercial real estate experience to STRIVE's multifamily division, where she helps investors identify and execute opportunities across the Texas market.\n\nHer career spans investment sales and corporate portfolio management, with over $400M in closed transactions across multifamily, self-storage, industrial, and SFR assets. Before focusing on investment sales, she spent nearly two decades at Cushman & Wakefield and CBRE, managing complex corporate portfolios for Fortune 500 clients including Bank of America, General Electric, and Nokia.\n\nThat foundation gives her clients a full transaction lifecycle perspective — fro d friends.","email":"kpatel@strivere.com","phone":"(214) 850-5901","linkedin":"","photo":"https://strivenext.s3.amazonaws.com/website/contacts/314230/Krish%20Favorite%20-%20Website_Oy6ir.png"},{"id":"mem_yamylakeshavjee","name":"Yamyla Keshavjee","role":"Marketing Coordinator","bio":"Yamyla Keshavjee is a Marketing Coordinator for STRIVE, where she supports and executes digital marketing campaigns across various channels that are designed to elevate content creation, strategic communications, and increase brand awareness.\n\nYamyla earned her bachelor's in business administration and marketing from the University of Arkansas where she developed a strong understanding of market research, consumer behavior, and digital marketing. Yamyla was also a member of the Kappa Delta Zeta Gamma chapter.\n\nIn her free time, Yamyla enjoys spending time with family and friends, traveling, reading, and shopping.","email":"ykeshavjee@strivere.com","phone":"(469) 471-2027","linkedin":"https://www.linkedin.com/in/yamyla-keshavjee-a97687251/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/318264/Usethis.png"},{"id":"mem_lukelipscomb","name":"Luke Lipscomb","role":"Associate","bio":"Luke Lipscomb specializes in advising clients on the acquisition and disposition of Single-Tenant Retail assets in Northeast DFW. Luke graduated from the University of Kansas in 2026 with a bachelor’s degree in business administration. Prior to joining the Strive team Luke interned at UCR development and worked for the Midtown Improvement District of Dallas where he gained a deeper appreciation for the Dallas real estate market.\n\nLuke was born and raised in Lake Highlands, which has allowed him to bring a local perspective to the Dallas Market. When he’s not at the office he enjoys golf, shooting pool, and rooting for the Cowboys.","email":"llipscomb@strivere.com","phone":"(937) 823-7196","linkedin":"https://www.linkedin.com/in/luke-lipscomb/","photo":"https://strivenext.s3.amazonaws.com/web ew creative ideas and staying inspired by the people, places, and experiences around her.","email":"mdiaz@strivere.com","phone":"(214) 448-1001","linkedin":"https://www.linkedin.com/in/monserratdiaz1/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/499666/Monserrat%20Website_W3tGK.jpg2"},{"id":"mem_laurenwoodward","name":"Lauren Woodward","role":"Transaction Coordinator","bio":"Lauren Woodward is a Transaction Coordinator at STRIVE, where she supports the brokerage team throughout the transaction process and helps keep deals organized and moving efficiently from engagement through closing.\n\nLauren earned her bachelor’s degree in Hospitality Management from the University of North Texas. With a background centered around working with people, she enjoys building relationships, staying organized, and being part of a fast-paced team. She is excited to continue growing her knowledge and experience in the commercial real estate industry.\n\nOutside of work, Lauren enjoys golfing, traveling, staying active, and spending time with friends, family, and her dogs. She enjoys exploring new experiences and is always looking for opportunities to learn, grow, and challenge herself.","email":"lwoodward@strivere.com","phone":"(817) 233-7343","linkedin":"https://www.linkedin.com/in/lauren-woodward-35273438a/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/499744/maybe-2_wQWkW.jpg"},{"id":"mem_clarkhobbs","name":"Clark Hobbs","role":"AI Specialist","bio":"Clark Hobbs serves as an AI Engineer at STRIVE, focused on advancing the intersection of artificial intelligence, data, and commercial real estate. He works across the firm to develop and implement AI-driven systems that improve how STRIVE sources opportunities, conducts market and property research, analyzes data, and supports the investment sales process.\n\nClark is currently completing his degree at the University of Oklahoma, studying Finance and Management Information Systems with a focus on real estate finance. He is particularly interested in the continued advancement of AI within the industry and its potential to make commercial real estate more data-driven, efficient, and intelligent.\n\nOriginally from Dallas, Clark enjoys staying active, hiking, spending time with friends and family, and following the continued evolution of technology, real estate, and the Dallas market.","email":"chobbs@strivere.com","phone":"(469) 659-9595","linkedin":"https://www.linkedin.com/in/clarkhobbs/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/499746/Clark.png2.png"},{"id":"mem_jonahlester","name":"Jonah Lester","role":"Associate","bio":"Jonah Lester specializes in industrial investment sales, working with private investors, developers, and institutional clients on the acquisition and disposition of industrial real estate assets. He brings a strong interest in commercial real estate, capital markets, and investment strategy to his work, with a focus on understanding each client’s objectives and helping them identify opportunities that align with their investment goals.\n\nHe is currently completing his Finance degree at The University of Alabama and will graduate in December 2026. His background in finance has provided him with a strong foundation in financial analysis, valuation, and market fundamentals, which he applies to evaluating industrial investment opportunities and supporting clients throughout the transaction process. He brings a competitive mindset, strong work ethic, and relationship-driven approach to his role.\n\nOutside of the office, he enjoys traveling, experiencing new places and cultures, and running marathons. He is also a passionate sports fan and an avid supporter of the Dallas Cowboys and Alabama football. During football season, you can usually find him keeping up with the Cowboys on Sundays and cheering on the Crimson Tide on Saturdays.","email":"jlester@strivere.com","phone":"(937) 823-7196","linkedin":"https://www.linkedin.com/i   document.getElementById('tog').onclick=()=>{F.open=!F.open;listings()};app.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{F[c.dataset.f]=c.checked;listings()});
  app.querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{F[i.dataset.n]=i.value.replace(/[^0-9.]/g,'');clearTimeout(listings.t);listings.t=setTimeout(()=>{const k=i.dataset.n;listings();const x=app.querySelector('[data-n="'+k+'"]');x.focus();x.setSelectionRange(x.value.length,x.value.length)},350)})}
function video(u){if(!u)return'';let m=u.match(/(?:youtu\.be\/|v=|\/embed\/)([\w-]{6,})/);if(m)return'<div class="vid"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return'<div class="vid"><iframe src="https://player.vimeo.com/video/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';return''}
function property(id){stop();const l=L.find(x=>x.id===id);if(!l){app.innerHTML='<div class="empty">This listing is no longer available. <a href="#/listings" style="color:var(--green)">See all listings</a></div>';return}
  document.title='STRIVE | '+l.name;const subj=l.name+' - '+l.city+', '+l.state;const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([l.address,l.city,l.state,l.zip].filter(Boolean).join(', '));
  const stats=[l.sold?['Sold:',l.soldPrice?M(l.soldPrice):'']:['Price:',l.price||'Call for offers'],l.sold&&l.soldDate?['Closed:',new Date(l.soldDate+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})]:null,l.noi?['NOI:',M(l.noi)]:null,l.cap?['Cap Rate:',l.cap.toFixed(2)+'%']:null,l.occ!=null?['Occupancy:',l.occ+'%']:null,l.yearBuilt?['Year Built:',l.yearBuilt]:null,l.sf?['Square Feet:',N(l.sf)]:null,l.acres?['Lot Size:',l.acres+' AC']:null,l.units?['Units:',N(l.units)]:null,l.leaseType?['Lease Type:',l.leaseType]:null,l.tenant?['Tenant:',l.tenant]:null].filter(x=>x&&x[1]!=='');
  const hl=l.highlights;const short=hl.slice(0,3);

   +'<div class="PropertyContactList">'+l.agents.map(a=>'<div class="PropertyContact">'+(a.photo?'<img class="PropertyContact_img" src="'+E(a.photo)+'" alt="">':'<div class="PropertyContact_img"></div>')+'<div><div class="PropertyContact_name">'+E(a.name)+'</div><div class="PropertyContact_phone">'+E(a.phone)+'</div>'+(a.email?'<a class="PropertyContact_btn" href="mailto:'+E(a.email)+'?subject='+encodeURIComponent(subj)+'">Email '+E(a.first||a.name.split(' ')[0])+'</a>':'')+'</div></div>').join('')+'</div></div>'

   +(hl.length>3||l.description?'<div class="Property_detail" id="more"><div class="Property_detail_block">'+(l.description?'<h2>Overview</h2><p style="margin:0 0 30px;white-space:pre-wrap">'+E(l.description)+'</p>':'')+(hl.length>3?'<h2>Highlights</h2><ul>'+hl.map(h=>'<li>'+E(h)+'</li>').join('')+'</ul>':'')+'</div></div>':'')+video(l.video)+contactBand(subj);

/* the Offering Memorandum asks who you are first: email + Broker or Principal, filed to iSTRIVE (Website → OM requests) */
function omGate(l){const a=app.querySelector('[data-om]');if(!a)return;let who=null;try{who=JSON.parse(localStorage.getItem('strive.om.who')||'null')}catch(e){}
  const file=async(w)=>{if(!D.fb)return;const f={email:{stringValue:w.email},role:{stringValue:w.role},name:{stringValue:w.name||''},company:{stringValue:w.company||''},listing:{stringValue:l.id},listingName:{stringValue:l.name||''},at:{stringValue:new Date().toISOString()},u:{integerValue:String(Date.now())},page:{stringValue:location.href.slice(0,300)}};
    try{await fetch('https://firestore.googleapis.com/v1/projects/'+D.fb.projectId+'/databases/(default)/documents/leads?key='+D.fb.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})})}catch(e){}};
  const go=()=>{const x=document.createElement('a');x.href=a.getAttribute('href');x.download=a.getAttribute('download')||'';x.target='_blank';x.rel='noopener';document.body.appendChild(x);x.click();x.remove()};
  a.onclick=e=>{e.preventDefault();if(who&&who.email&&who.role&&who.t&&Date.now()-who.t<30*864e5){file(who);go();return}
    const m=document.createElement('div');m.className='OmGate';m.innerHTML='<div class="OmGate_card"><button class="OmGate_x" type="button" aria-label="Close">&times;</button><h2>Offering Memorandum</h2><p>Tell us who you are and the package opens right away.</p><form id="omf"><input name="name" placeholder="Name" autocomplete="name"><input name="email" type="email" placeholder="Email*" required autocomplete="email"><input name="company" placeholder="Company" autocomplete="organization"><div class="OmGate_role"><span>I am a</span><label><input type="radio" name="role" value="Broker" required> Broker</label><label><input type="radio" name="role" value="Principal" required> Principal</label></div><button class="PropertyHero_btn" type="submit" style="margin:14px 0 0">Open the package</button><div class="OmGate_fine">We will send you updates on STRIVE listings. Unsubscribe any time.</div></form></div>';
    document.body.appendChild(m);const close=()=>m.remove();m.querySelector('.OmGate_x').onclick=close;m.onclick=e=>{if(e.target===m)close()};if(who){const f=m.querySelector('#omf');['name','email','company'].forEach(k=>{if(who[k])f.elements[k].value=who[k]})}
    m.querySelector('#omf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.email||!d.role)return;who={email:d.email.trim(),role:d.role,name:(d.name||'').trim(),company:(d.company||'').trim(),t:Date.now()};try{localStorage.setItem('strive.om.who',JSON.stringify(who))}catch(err){}e.target.querySelector('button[type=submit]').textContent='Opening…';await file(who);close();go()}}}
function route(){const h=location.hash||'#/';const seg=h.slice(2).split('/');const r=seg[0]||'home';const pg=D.nav.find(n=>n.id===r);const type=r==='home'?'home':r==='property'?'property':pg?pg.type:'';document.title='STRIVE | '+(r==='home'?'Commercial Real Estate Advisors':pg?pg.label:r==='property'?'Listing':'STRIVE');
  const lst=(D.nav.find(n=>n.type==='listings')||{}).id,tm=(D.nav.find(n=>n.type==='team')||{}).id;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('cur',a.dataset.r===r||(r==='property'&&a.dataset.r===lst)||(r==='join'&&a.dataset.r===tm)));
  if(type==='home')home();else if(type==='team')team();else if(r==='join')join();else if(type==='text')page(r);else if(type==='listings')listings();else if(type==='property')property(decodeURIComponent(seg[1]||''));else if(type==='news')news();else if(type==='events')events();else if(type==='contact')contact();else home();
  if(r==='team'&&seg[1]){const el=document.getElementById('m-'+seg[1]);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),50)}else window.scrollTo(0,0)}
addEventListener('hashchange',route);route()})();
