/* news / events */
.News{max-width:992px;margin:0 auto;padding:60px 30px;display:flex;gap:30px}.News_tabs{flex:0 0 235px}.News_tabs button{display:block;width:100%;text-align:left;padding:14px 16px;background:#f3f3f3;border:0;border-bottom:1px solid #fff;font-size:15px;cursor:pointer}.News_tabs button.on{background:var(--green);color:#fff}.News_panel{flex:1}.News_panel h3{font-size:22px;font-weight:400;margin:0 0 14px}.News_panel ul{list-style:none;padding:0;margin:0}.News_panel li{padding:4px 0;display:flex;justify-content:space-between;gap:16px}.News_panel li a{color:var(--blue)}.News_panel li span{color:var(--grey);font-size:13px;white-space:nowrap}
.Event{padding:16px 0;border-bottom:1px solid var(--line)}.Event b{font-size:18px;font-weight:400;display:block}.Event .dt{color:var(--green)}.Event p{margin:6px 0 0}
/* contact */
.Contact{background:#a0a0a0 ;padding:30px 0}.Contact_inner{max-width:992px;margin:0 auto;display:flex;background:#fff}.Contact_form{flex:1;padding:30px}.Contact_form h2{font-size:24px;font-weight:400;margin:0 0 20px}.Contact_form input,.Contact_form textarea{display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:8px 0;font:inherit;font-size:16px;margin-bottom:8px;background:none;outline:none}.Contact_form textarea{height:70px;resize:vertical}.Contact_form button{width:100%;background:var(--green);color:#fff;border:0;padding:9px;margin-top:10px;cursor:pointer}
.Contact_side{flex:0 0 466px;background:#e5e3df;padding:30px}.Office{margin-bottom:22px}.Office b{display:block;font-size:17px;font-weight:600}.Office div{white-space:pre-line}.Office a{color:var(--blue)}.Contact_map{height:220px;margin-top:10px}.Contact_map iframe{width:100%;height:100%;border:0}
.Footer{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;background:#202124;color:#fff;padding:30px 0;text-align:center}.Footer a{display:block;padding:0 5px}.Footer a+a:before{content:"| "}.Footer .fine{width:100%;color:#aaa;font-size:12px;margin-top:8px}
.empty{max-width:992px;margin:0 auto;padding:80px 30px;text-align:center;color:var(--grey)}
@media(max-width:1300px){.Listings_item{width:calc(33.333% - 10px)}.Listings_list:after{flex-basis:calc(33.333% - 10px)}}
@media(max-width:1000px){.Listings_item{width:calc(50% - 8px)}.Listings_list:after{display:none}.PropertyHero{flex-direction:column}.PropertyHero_media{width:auto;flex:none}.PropertyHero_info{margin:30px 0 0;padding:30px 0 0;border-left:0;border-top:1px solid var(--green)}.Contact_inner,.News,.Bio{flex-direction:column}.Contact_side{flex:none}.News_tabs{flex:none;display:flex;overflow:auto}.News_tabs button{width:auto}}
@media(max-width:640px){.Header{height:auto;flex-direction:column;align-items:flex-start}.Header_nav{padding:0 14px 10px}.Header_nav a,.Header_nav .dd>span{padding:6px 8px;font-size:13px}.Listings_item{width:100%}.ListingsHead_title,.page h1{font-size:28px}.Filter_types{flex-direction:column;gap:10px}.PropertyContact{width:100%}.sec h2{font-size:24px}.slider .desc b{font-size:26px}.Team_item{width:100%;height:auto;aspect-ratio:1}}

, and God knows we had a lot of bumps on this one.","name":"Jorge Martinez","company":"System One Consulting"},{"quote":"STRIVE recently sold a community shopping center for us in DFW. We have worked with many disposition firms over the years. STRIVE is head and shoulders above the rest in all facets of the business relationship: integrity, knowledge, work ethic, strategy, and organization. They know how to combine it all and close deals. And, they are good people. We are pleased to continue our working relationship and have recently listed another shopping center with them.","name":"Mark Billeaud","company":"President and Partner – Summit Real Estate Group"},{"quote":"I have personally known Jennifer Pierson for 13 years and closed on several acquisitions and dispositions through Jennifer. Her integrity and moral compass are the cornerstone to her extremely hard-working style of closing deals. Jennifer is the reason our deals transacted quickly and at the right pricing levels. In a short 16 months, Jennifer Pierson has risen to the top of the brokerage world with her new company, Strive Real Estate Group. She is a true asset to any transaction and among the best in the business. Thanks to her for being a huge part of our success at GDA.","name":"Gary Dragul","company":"President – GDA Real Estate Services"},{"quote":"Jennifer was instrumental in bringing our deal to fruition. She is truly the professional in retail real estate brokerage.","name":"Amin Bata","company":"Bata Ventures, Inc."},{"quote":"Jennifer has recently sold two properties for us. Two of her strengths have been turning up buyers that are not the typical Real Estate investors and having a steady supply of tax exchange buyers. Jennifer Pierson was very professional and diligent and a pleasure to work with during both transactions.","name":"David Pemberton","company":"Centcom Realty Corp."},{"quote":"Jennifer Pierson has sold one of Baceline Investments’ retail assets in the past. In our most recent transaction, they sold a retail shopping center to us. Working with them resulted in a successful close in both instances. Jennifer exhibits market and transactional knowledge that facilitates results.","name":"Doug Arnold","company":"Baceline Investments"},{"quote":"Over the past several years, Jennifer has acted for me on the acquisition and sale of three neighborhood strip centers in the Dallas/Fort Worth Market. Jennifer’s insight into market dynamics and property potential has been invaluable to the success of these investments. She provided excellent advice on the acquisition side of the transactions and great access to potential buyers when the time to sell arrived. Her interpersonal and profession skills, along with deep market knowledge, have made a powerful contribution to our success. I look forward to working with Jennifer in the future.","name":"Michael Young","company":"Quadrant Capital Partners"},{"quote":"Jennifer and her team orchestrated a highly effective sales process with excellent execution and exemplary results.","name":"Alan Shapiro","company":"Glenborough"}],"volume":"$2M","L":[{"id":"om_17611kuykendahl77379_c8a9e","name":"Kuykendahl Plaza","address":"17611 Kuykendahl Rd","city":"Spring","state":"TX","zip":"77379","lat":30.027623,"lng":-95.479139,"kind":"multi","type":"MT","product":"Retail MT","status":"Available","sold":false,"price":"$2,545,000","priceNum":2545000,"cap":7.94728330058939,"noi":202258.36,"occ":100,"sf":13350,"acres":1.106,"yearBuilt":1983,"units":7,"leaseType":"NNN","tenant":"","soldDate":"","soldPrice":null,"description":"","highlights":[],"photos":["https://strivenext.s3.amazonaws.com/website/property-photos/62842/Cover.JPG"],"om":null,"flipbook":"","video":"","featured":false,"slider":false,"agents":[{"name":"Michael Hill","first":"Michael","phone":"(832) 516-1964","email":"mhill@strivere.com","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50678/Michael%20Cropped.png"}],"updated":"2026-11-13T16:23:38.151Z" ing her degree in Real Estate Finance at Arizona State University. She went on to spend 21 years as an investment sales professional at CBRE, where she was named Rookie of the Year in her first year and subsequently ranked as a Top 20 Producer in Dallas/Fort Worth in virtually every year that followed. Nationally, she earned recognition as a Top 200 Producer and as a member of the Colbert Coldwell Circle—an honor reserved for the top one percent of sales professionals firmwide.\n\nFrom 2010 to 2013, Ms. Pierson was selected to lead CBRE’s United States Private Capital Investment Group, with more than 300 brokers across the country reporting to her. She led the platform while simultaneously maintaining her own investment sales practice, exceeding performance expectations in recruiting and revenue growth and remaining among the firm’s most productive brokers.\n\nIn 2015, Ms. Pierson fulfilled a long-held ambition by founding her own retail investment firm, Pierson Retail Advisors, created to help property owners and investors achieve maximum value in the disposition of their commercial real estate assets. The platform evolved into STRIVE, which today is a meaningful force across the DFW and Houston marketplaces, transacting in industrial, office, retail, and multifamily product types throughout the state of Texas.\n\nOutside of her professional life, Ms. Pierson is an avid skier, painter, and traveler, and treasures time spent with family and friends. She resides in Dallas with her husband, Mark, and together they have six children.","email":"jpierson@strivere.com","phone":"(214) 354-6820","linkedin":"https://www.linkedin.com/in/jennifer-pierson-743083b/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50602/Jennifer%20Blurred%20Offic_tIF6V.jpg"},{"id":"mem_jakedutson","name":"Jake Dutson","role":"Partner","bio":"Jake Dutson serves as a Partner and the Houston Market Leader for STRIVE, leveraging over six years of specialized experience in retail investment property sales across Texas. His role involves sourcing investment opportunities, overseeing ownership transitions, and leading marketing efforts for multi-tenant shopping centers and single-tenant net-leased retail buildings. Jake and his team of agents in Houston work in unison with the firm’s Dallas office to provide their clients with real-time insights and exposure to the Texas marketplace.\n\nSince 2019, Jake has advised clients in the sale of over $200 million in total consideration. He has been recognized as a \"Top Power Broker\" in Dallas Magazine's CEO Edition and received the \"Heavy Hitter\" title in CRE Investment from the Houston Business Journal in 2023. Additionally, in 2023, he was nominated for the Houston Emerging Leader of the Year Award by REDnews. Jake's enthusiastic commitment to diligence, hard work, and growth has contributed to STRIVE's prominence in the Houston retail investment sales sector.\n\nJake grew up in Tucson, Arizona with his twin brother and two older sisters. He spent eight years of his childhood abroad, living on four continents in countries such as Indonesia, Macedonia, and Venezuela. A graduate of the University of Arizona in 2017, Jake earned degrees in Economics and Finance while working as an intern for Mid-America Real Estate in Chicago, IL his senior year. Jake moved to Texas immediately after college to join STRIVE at its inception.","email":"jdutson@strivere.com","phone":"(520) 241-5744","linkedin":"https://www.linkedin.com/in/jakedutson/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/50625/Jake%20Cropped.jpg"},{"id":"mem_bryanmeyer","name":"Bryan Meyer","role":"Partner","bio":"Bryan Meyer joined STRIVE in 2023 and specializes in advising clients in the acquisition and disposition of industrial assets. Bryan has over 15 years in Industrial Sales, Business Development, and Management Experience. Bryan won numerous sales awards before transitioning into a business development and consulting role for amazonaws.com/website/contacts/499664/Cooper%20Website.png2.png"},{"id":"mem_monserratdiaz","name":"Monserrat Diaz","role":"Marketing Coordinator","bio":"Monserrat Diaz is a Marketing Coordinator at STRIVE, where she supports marketing initiatives through creative content, proposals, and strategic communications.\n\nWith a background in marketing and a passion for graphic design, Monserrat enjoys bringing ideas and brands to life through creative visuals, engaging content, and thoughtful storytelling. She earned her bachelor’s degree in marketing from Texas State University, where she developed a strong foundation in branding, digital marketing, and consumer engagement.\n\nOutside of work, Monserrat prioritizes fitness and an active lifestyle and enjoys traveling, exploring new experiences, and spending quality time with family and friends. She also enjoys discovering new creative ideas and staying inspired by the people, places, and experiences around her.","email":"mdiaz@strivere.com","phone":"(214) 448-1001","linkedin":"https://www.linkedin.com/in/monserratdiaz1/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/499666/Monserrat%20Website_W3tGK.jpg2"},{"id":"mem_laurenwoodward","name":"Lauren Woodward","role":"Transaction Coordinator","bio":"Lauren Woodward is a Transaction Coordinator at STRIVE, where she supports the brokerage team throughout the transaction process and helps keep deals organized and moving efficiently from engagement through closing.\n\nLauren earned her bachelor’s degree in Hospitality Management from the University of North Texas. With a background centered around working with people, she enjoys building relationships, staying organized, and being part of a fast-paced team. She is excited to continue growing her knowledge and experience in the commercial real estate industry.\n\nOutside of work, Lauren enjoys golfing, traveling, staying active, and spending time with friends, family, and her dogs. She enjoys exploring new experiences and is always looking for opportunities to learn, grow, and challenge herself.","email":"lwoodward@strivere.com","phone":"(817) 233-7343","linkedin":"https://www.linkedin.com/in/lauren-woodward-35273438a/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/499744/maybe-2_wQWkW.jpg"},{"id":"mem_clarkhobbs","name":"Clark Hobbs","role":"AI Specialist","bio":"Clark Hobbs serves as an AI Engineer at STRIVE, focused on advancing the intersection of artificial intelligence, data, and commercial real estate. He works across the firm to develop and implement AI-driven systems that improve how STRIVE sources opportunities, conducts market and property research, analyzes data, and supports the investment sales process.\n\nClark is currently completing his degree at the University of Oklahoma, studying Finance and Management Information Systems with a focus on real estate finance. He is particularly interested in the continued advancement of AI within the industry and its potential to make commercial real estate more data-driven, efficient, and intelligent.\n\nOriginally from Dallas, Clark enjoys staying active, hiking, spending time with friends and family, and following the continued evolution of technology, real estate, and the Dallas market.","email":"chobbs@strivere.com","phone":"(469) 659-9595","linkedin":"https://www.linkedin.com/in/clarkhobbs/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/499746/Clark.png2.png"},{"id":"mem_jonahlester","name":"Jonah Lester","role":"Associate","bio":"Jonah Lester specializes in industrial investment sales, working with private investors, developers, and institutional clients on the acquisition and disposition of industrial real estate assets. He brings a strong interest in commercial real estate, capital markets, and investment strategy to his work, with a focus on understanding each client’s objectives and helping them identify opportunities that align with their investment goals.\n\nHe is currently com ities to learn, grow, and challenge herself.","email":"lduvall@strivere.com","phone":"(214) 846-7474","linkedin":"https://www.linkedin.com/in/lindsey-duvall-321847252/","photo":"https://strivenext.s3.amazonaws.com/website/contacts/500045/Favorite%20for%20website%20cropped.jpeg"}],"slides":[{"id":"pro_riveroaksplazafortworth","name":"River Oaks Plaza","city":"Fort Worth","state":"TX","img":"https://strivenext.s3.amazonaws.com/website/property-photos/201191/COVER.png"}],"nav":[{"id":"team","label":"Who","type":"team"},{"id":"what","label":"What","type":"text"},{"id":"how","label":"How","type":"text"},{"id":"listings","label":"Listings","type":"listings"},{"id":"news","label":"News","type":"news"},{"id":"events","label":"Events","type":"events"},{"id":"contact","label":"Contact","type":"contact"},{"id":"join","label":"Join Our Team","type":"text","hidden":true}],"home":{"sections":[{"img":"","title":"\"COMING TOGETHER IS THE BEGINNING. KEEPING TOGETHER IS PROGRESS. WORKING TOGETHER IS SUCCESS.\"","sub":"- HENRY FORD","btn":"JOIN OUR TEAM","href":"#/join"},{"img":"","title":"#1 RETAIL TEAM IN SOUTHWEST","sub":"1775+ TRANSACTIONS | OVER $6.9 BILLION SOLD","btn":"MEET OUR TEAM","href":"#/team"},{"img":"","title":"STRATEGIC PARTNERS. NOT JUST BROKERS.","sub":"","btn":"MEET OUR TEAM","href":"#/team"},{"img":"","title":"OFFICE, INDUSTRIAL, RETAIL & MULTI FAMILY INVESTMENT SALES","sub":"IN TEXAS AND SURROUNDING STATES","btn":"LEARN MORE","href":"#/what"},{"img":"","title":"WE CLOSE TRANSACTIONS.","sub":"SPEED. EFFICIENCY. EXECUTION. RESULTS.","btn":"LEARN MORE","href":"#/how"}],"testimonials":[],"layout":"new","teamImg":"","teamQuote":"\"STRIVE NOT TO BE A SUCCESS, BUT RATHER TO BE OF VALUE.\"","teamBy":"- ALBERT EINSTEIN","stats":{"mtTx":1576,"mtVol":2605680922,"allTx":1575,"allVol":6000000000},"bands":[{"theme":"dark","img":"","tiles":[{"top":"OFFICE, INDUSTRIAL\nRETAIL & MULTI FAMILY","bold":"INVESTMENT SALES","bottom":"IN TEXAS AND SURROUNDING STATES","small":"","href":"# function news(){stop();const items=(D.news||[]).filter(n=>n.title).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));const years=[...new Set(items.map(n=>String(n.date||'').slice(0,4)||'Other'))];let y=location.hash.split('/')[2]||years[0];

function events(){stop();const items=(D.events||[]).filter(e=>e.title).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  app.innerHTML='<div class="page"><h1>Events</h1>'+(items.length?items.map(e=>'<div class="Event"><span class="dt">'+E(e.date?new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'')+'</span><b>'+(e.url?'<a href="'+E(e.url)+'" target="_blank" rel="noopener">'+E(e.title)+'</a>':E(e.title))+'</b>'+(e.where?'<div style="color:var(--grey)">'+E(e.where)+'</div>':'')+(e.desc?'<p>'+E(e.desc)+'</p>':'')+'</div>').join(''):'<p class="empty">No events yet.</p>')+'</div>'}

const F={single:false,multi:false,history:false,open:false,pmin:'',pmax:'',cmin:'',cmax:''};
function item(l){const info=[l.sold?(l.soldPrice?'Sold: '+M(l.soldPrice):'Sold'):(l.price?'Price: '+l.price:''),l.cap?'Cap Rate: '+l.cap.toFixed(2)+'%':''].filter(Boolean);
  return '<a class="Listings_item" href="#/property/'+E(l.id)+'"><div><div class="Listings_item_image" style="'+(l.photos[0]?'background-image:url(&quot;'+E(l.photos[0])+'&quot;)':'')+'"></div><div class="Listings_item_name">'+E(l.name)+'</div><div class="Listings_item_addr">'+E(l.city+', '+l.state)+'</div></div><div class="Listings_item_body"><div class="Listings_item_name">'+E(l.name)+'</div><div class="Listings_item_addr">'+E(l.city+', '+l.state)+'</div>'+info.map(x=>'<div class="Listings_item_info">'+E(x)+'</div>').join('')+'<div class="Listings_item_more">'+E(l.status)+'</div><div class="Listings_item_more">More info</div></div></a>'}
function listings(){stop();const any=F.single||F.multi;let R=L.filter(l=>F.history?l.sold:!l.sold).filter(l=>!any||(F.single&&l.kind==='single')||(F.multi&&l.kind!=='single'));
  const pmin=+F.pmin||0,pmax=+F.pmax||0,cmin=+F.cmin||0,cmax=+F.cmax||0;R=R.filter(l=>(!pmin||(l.priceNum||0)>=pmin)&&(!pmax||(l.priceNum||0)<=pmax)&&(!cmin||(l.cap||0)>=cmin)&&(!cmax||(l.cap||0)<=cmax));
  R.sort((a,b)=>(b.featured-a.featured)||(a.sold&&b.sold?String(b.soldDate).localeCompare(String(a.soldDate)):0));
  const cards=R.map(item);if(!F.history&&D.team_.joinTile)cards.splice(Math.min(2,cards.length),0,'<a href="#/join" class="Listings_item Listings_item--join"><span class="Listings_item_join_inner"><span>Join</span><span>our</span><span>team!</span></span></a>');
  const cb=(k,l)=>'<label><input type="checkbox" data-f="'+k+'" '+(F[k]?'checked':'')+'>'+l+'</label>';const nm=(k,l,ph)=>'<label>'+l+'<input data-n="'+k+'" placeholder="'+ph+'" value="'+E(F[k])+'" inputmode="decimal"></label>';
  app.innerHTML='<div class="wrap"><div class="ListingsHead"><div class="ListingsHead_title">Listings</div><div class="ListingsHead_toggle"><button type="button" class="ListingsHead_toggle_btn" id="tog">Filter By '+(F.open?'&minus;':'+')+'</button></div><div class="Filter '+(F.open?'on':'')+'"><div class="Filter_types">'+cb('single','Single-Tenant')+cb('multi','Multi-Tenant')+cb('history','Transaction History')+'</div><div class="Filter_nums">'+nm('pmin','Min Price','$')+nm('pmax','Max Price','$')+nm('cmin','Min Cap','%')+nm('cmax','Max Cap','%')+'</div></div></div><div class="Listings"><div class="Listings_list">'+(cards.length?cards.join(''):'<div class="Listings_empty">No listings match these filters.</div>')+'</div></div></div>';
  document.getElementById('tog').onclick=()=>{F.open=!F.open;listings()};app.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{F[c.dataset.f]=c.checked;listings()});
  app.querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{F[i.dataset.n]=i.value.replace(/[^0-9.]/g,'');clearTimeout(listings.t);listings.t=setTimeout(()=>{const k=i.dataset.n;listings();const x=app.querySelector('[data-n="'+k+'"]');x.focus();x.setSelectionRange(x.value.length,x.value.length)},350)})}
function video(u){if(!u)return'';let m=u.match(/(?:youtu\.be\/|v=|\/embed\/)([\w-]{6,})/);if(m)return'<div class="vid"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return'<div class="vid"><iframe src="https://player.vimeo.com/video/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';return''}
function property(id){stop();const l=L.find(x=>x.id===id);if(!l){app.innerHTML='<div class="empty">This listing is no longer available. <a href="#/listings" style="color:var(--green)">See all listings</a></div>';return}
  document.title='STRIVE | '+l.name;const subj=l.name+' - '+l.city+', '+l.state;const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([l.address,l.city,l.state,l.zip].filter(Boolean).join(', '));
  const stats=[l.sold?['Sold:',l.soldPrice?M(l.soldPrice):'']:['Price:',l.price||'Call for offers'],l.sold&&l.soldDate?['Closed:',new Date(l.soldDate+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})]:null,l.noi?['NOI:',M(l.noi)]:null,l.cap?['Cap Rate:',l.cap.toFixed(2)+'%']:null,l.occ!=null?['Occupancy:',l.occ+'%']:null,l.yearBuilt?['Year Built:',l.yearBuilt]:null,l.sf?['Square Feet:',N(l.sf)]:null,l.acres?['Lot Size:',l.acres+' AC']:null,l.units?['Units:',N(l.units)]:null,l.leaseType?['Lease Type:',l.leaseType]:null,l.tenant?['Tenant:',l.tenant]:null].filter(x=>x&&x[1]!=='');
  const hl=l.highlights;const short=hl.slice(0,3);
  app.innerHTML='<div class="Property_head"><div class="Property_head_back"><a href="#/listings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4-6-6 6-6z"/></svg><span>Back to listings</span></a></div>'
   +'<div class="PropertyHero"><div class="PropertyHero_media"><div class="PropertyPhotos_big">'+(l.photos[0]?'<img id="big" src="'+E(l.photos[0])+'" alt="'+E(l.name)+'">':'')+'</div><div class="paginationWrapper">'+(l.photos.length>1?l.photos.map((u,i)=>'<button class="paginationButton '+(i?'':'active')+'" data-u="'+E(u)+'" aria-label="Photo '+(i+1)+'"></button>').join(''):'<button class="paginationButton active"></button>')+'</div>'
   +'<div class="PropertyContactList">'+l.agents.map(a=>'<div class="PropertyContact">'+(a.photo?'<img class="PropertyContact_img" src="'+E(a.photo)+'" alt="">':'<div class="PropertyContact_img"></div>')+'<div><div class="PropertyContact_name">'+E(a.name)+'</div><div class="PropertyContact_phone">'+E(a.phone)+'</div>'+(a.email?'<a class="PropertyContact_btn" href="mailto:'+E(a.email)+'?subject='+encodeURIComponent(subj)+'">Email '+E(a.first||a.name.split(' ')[0])+'</a>':'')+'</div></div>').join('')+'</div></div>'
   +'<div class="PropertyHero_info"><div class="PropertyHead"><div><div class="PropertyHead_body_name">'+E(l.name)+'</div><div class="PropertyHead_body_address"><div>'+E(l.address)+'</div><div>'+E(l.city+', '+l.state+' '+l.zip)+'</div></div></div><a class="PropertyHead_map" href="'+maps+'" target="_blank" rel="noopener">'+PIN+'<span>view map</span></a></div>'
   +'<div class="PropertyHero_status '+(l.status==='Under Contract'||l.status==='In Negotiation'?'uc':'')+'">'+E(l.status)+'</div><div class="PropertyStats">'+stats.map(([k,v])=>'<dl><dt>'+E(k)+'</dt><dd>'+E(v)+'</dd></dl>').join('')+'</div>'
   +(l.om?'<a class="PropertyHero_btn" href="'+E(l.om.url)+'" download="'+E(l.om.name)+'" data-om="'+E(l.id)+'">Download Package</a>':'')+(l.flipbook?'<a class="PropertyHero_btn" href="'+E(l.flipbook)+'" target="_blank" rel="noopener">View Flipbook</a>':'')
   +(hl.length?'<div class="Property_detail_block" style="margin-top:14px"><h2>Highlights</h2><ul>'+short.map(h=>'<li>'+E(h)+'</li>').join('')+'</ul>'+(hl.length>3?'<a class="PropertyHero_btn" href="#more" style="font-size:15px">See More...</a>':'')+'</div>':'')+'</div></div></div>'
   +(hl.length>3||l.description?'<div class="Property_detail" id="more"><div class="Property_detail_block">'+(l.description?'<h2>Overview</h2><p style="margin:0 0 30px;white-space:pre-wrap">'+E(l.description)+'</p>':'')+(hl.length>3?'<h2>Highlights</h2><ul>'+hl.map(h=>'<li>'+E(h)+'</li>').join('')+'</ul>':'')+'</div></div>':'')+video(l.video)+contactBand(subj);
  app.querySelectorAll('.paginationButton[data-u]').forEach(b=>b.onclick=()=>{document.getElementById('big').src=b.dataset.u;app.querySelectorAll('.paginationButton').forEach(x=>x.classList.toggle('active',x===b))});wireForm();omGate(l)}
/* the Offering Memorandum asks who you are first: email + Broker or Principal, filed to iSTRIVE (Website → OM requests) */
function omGate(l){const a=app.querySelector('[data-om]');if(!a)return;let who=null;try{who=JSON.parse(localStorage.getItem('strive.om.who')||'null')}catch(e){}
  const file=async(w)=>{if(!D.fb)return;const f={email:{stringValue:w.email},role:{stringValue:w.role},name:{stringValue:w.name||''},company:{stringValue:w.company||''},listing:{stringValue:l.id},listingName:{stringValue:l.name||''},at:{stringValue:new Date().toISOString()},u:{integerValue:String(Date.now())},page:{stringValue:location.href.slice(0,300)}};
    try{await fetch('https://firestore.googleapis.com/v1/projects/'+D.fb.projectId+'/databases/(default)/documents/leads?key='+D.fb.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})})}catch(e){}};
  const go=()=>{const x=document.createElement('a');x.href=a.getAttribute('href');x.download=a.getAttribute('download')||'';x.target='_blank';x.rel='noopener';document.body.appendChild(x);x.click();x.remove()};
  a.onclick=e=>{e.preventDefault();if(who&&who.email&&who.role&&who.t&&Date.now()-who.t<30*864e5){file(who);go();return}
    const m=document.createElement('div');m.className='OmGate';m.innerHTML='<div class="OmGate_card"><button class="OmGate_x" type="button" aria-label="Close">&times;</button><h2>Offering Memorandum</h2><p>Tell us who you are and the package opens right away.</p><form id="omf"><input name="name" placeholder="Name" autocomplete="name"><input name="email" type="email" placeholder="Email*" required autocomplete="email"><input name="company" placeholder="Company" autocomplete="organization"><div class="OmGate_role"><span>I am a</span><label><input type="radio" name="role" value="Broker" required> Broker</label><label><input type="radio" name="role" value="Principal" required> Principal</label></div><button class="PropertyHero_btn" type="submit" style="margin:14px 0 0">Open the package</button><div class="OmGate_fine">We will send you updates on STRIVE listings. Unsubscribe any time.</div></form></div>';
    document.body.appendChild(m);const close=()=>m.remove();m.querySelector('.OmGate_x').onclick=close;m.onclick=e=>{if(e.target===m)close()};if(who){const f=m.querySelector('#omf');['name','email','company'].forEach(k=>{if(who[k])f.elements[k].value=who[k]})}
    m.querySelector('#omf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.email||!d.role)return;who={email:d.email.trim(),role:d.role,name:(d.name||'').trim(),company:(d.company||'').trim(),t:Date.now()};try{localStorage.setItem('strive.om.who',JSON.stringify(who))}catch(err){}e.target.querySelector('button[type=submit]').textContent='Opening…';await file(who);close();go()}}}
function route(){const h=location.hash||'#/';const seg=h.slice(2).split('/');const r=seg[0]||'home';const pg=D.nav.find(n=>n.id===r);const type=r==='home'?'home':r==='property'?'property':pg?pg.type:'';document.title='STRIVE | '+(r==='home'?'Commercial Real Estate Advisors':pg?pg.label:r==='property'?'Listing':'STRIVE');
  const lst=(D.nav.find(n=>n.type==='listings')||{}).id,tm=(D.nav.find(n=>n.type==='team')||{}).id;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('cur',a.dataset.r===r||(r==='property'&&a.dataset.r===lst)||(r==='join'&&a.dataset.r===tm)));
  if(type==='home')home();else if(type==='team')team();else if(r==='join')join();else if(type==='text')page(r);else if(type==='listings')listings();else if(type==='property')property(decodeURIComponent(seg[1]||''));else if(type==='news')news();else if(type==='events')events();else if(type==='contact')contact();else home();
  if(r==='team'&&seg[1]){const el=document.getElementById('m-'+seg[1]);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),50)}else window.scrollTo(0,0)}
/* the two notices are built into the page: open them in a new tab like any other PDF */
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.Footer a');if(!a)return;const h=a.getAttribute('href')||'';if(h.indexOf('data:application/pdf')!==0)return;e.preventDefault();const w=window.open('about:blank','_blank');fetch(h).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);if(w)w.location=u;else{const x=document.createElement('a');x.href=u;x.download=(a.getAttribute('download')||'notice.pdf');x.click()}}).catch(()=>{if(w)w.close()})});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.Header_logo');if(!a)return;const h=location.hash;if(h===''||h==='#'||h==='#/'||h==='#/home'){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}});
addEventListener('hashchange',route);route()})();
