  const T=(D.home.testimonials||[]).filter(t=>t.quote);const testi=T.length?'<div class="testi"><div class="in">'+T.map(t=>'<blockquote>"'+E(t.quote)+'"<footer><b>'+E(t.name)+'</b>'+E(t.company)+'</footer></blockquote>').join('')+'</div></div>':'';
  app.innerHTML=slider+secs+testi+(slider||secs?'':'<div class="empty">Build the home page in iSTRIVE → Website.</div>');
  const el=document.getElementById('slider');if(el&&S.length>1){const sl=el.querySelectorAll('.sl');const go=k=>{i=(k+S.length)%S.length;sl.forEach((x,j)=>x.classList.toggle('on',j===i))};el.querySelector('.arr.l').onclick=()=>go(i-1);el.querySelector('.arr.r').onclick=()=>go(i+1);timer=setInterval(()=>go(i+1),6000)}}
/* team */
function team(){stop();const T=D.team;if(!T.length){app.innerHTML='<div class="empty">No team members are marked "Show on website" yet.</div>';return}
  const grid='<div class="Team_photos"><div class="Team_grid">'+T.map(m=>'<a class="Team_item" href="#/team/'+E(m.id)+'" style="'+(m.photo?'background-image:url(&quot;'+E(m.photo)+'&quot;)':'')+'"><div class="body"><div class="nm">'+E(m.name)+'</div><div class="rl">'+E(m.role)+'</div></div></a>').join('')+(D.team_.joinTile?'<a class="Team_item join" href="#/join">Join<br>our<br>team!</a>':'')+'</div></div>';
  const bios='<div class="Bios">'+(D.team_.intro?'<p>'+E(D.team_.intro)+'</p>':'')+T.map(m=>'<div class="Bio" id="m-'+E(m.id)+'"><div class="pic">'+(m.photo?'<img src="'+E(m.photo)+'" alt="">':'<div class="ph"></div>')+'</div><div><div class="nm">'+E(m.name)+'</div><div class="rl">'+E(m.role)+'</div><div class="ic">'+(m.email?'<a href="mailto:'+E(m.email)+'">Email</a>':'')+(m.phone?'<a href="tel:'+E(m.phone.replace(/\D/g,''))+'">'+E(m.phone)+'</a>':'')+(m.linkedin?'<a href="'+E(m.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a>':'')+'</div><div class="tx">'+E(m.bio)+'</div></div></div>').join('')+'</div>';
  app.innerHTML=grid+bios}
function page(k){stop();const P=D.pages[k]||{};app.innerHTML='<div class="page"><h1>'+E(P.title||k)+'</h1>'+(P.html||'<p class="empty">Nothing here yet — write this page in iSTRIVE → Website.</p>')+'</div>'+(k==='join'?contactBand('Join our team'):'');wireForm()}
function news(){stop();const items=(D.news||[]).filter(n=>n.title).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));const years=[...new Set(items.map(n=>String(n.date||'').slice(0,4)||'Other'))];let y=location.hash.split('/')[2]||years[0];
  app.innerHTML='<div class="News"><div class="News_tabs">'+years.map(v=>'<button class="'+(v===y?'on':'')+'" data-y="'+E(v)+'">'+E(v)+'</button>').join('')+'</div><div class="News_panel"><h3>In The News</h3>'+(items.length?'<ul>'+items.filter(n=>(String(n.date||'').slice(0,4)||'Other')===y).map(n=>'<li>'+(n.url?'<a href="'+E(n.url)+'" target="_blank" rel="noopener">'+E(n.title)+'</a>':'<span style="color:var(--ink)">'+E(n.title)+'</span>')+'<span>'+E(n.source||'')+'</span></li>').join('')+'</ul>':'<p class="empty">No news items yet.</p>')+'</div></div>';
  app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{location.hash='#/news/'+b.dataset.y})}
function events(){stop();const items=(D.events||[]).filter(e=>e.title).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  app.innerHTML='<div class="page"><h1>Events</h1>'+(items.length?items.map(e=>'<div class="Event"><span class="dt">'+E(e.date?new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'')+'</span><b>'+(e.url?'<a href="'+E(e.url)+'" target="_blank" rel="noopener">'+E(e.title)+'</a>':E(e.title))+'</b>'+(e.where?'<div style="color:var(--grey)">'+E(e.where)+'</div>':'')+(e.desc?'<p>'+E(e.desc)+'</p>':'')+'</div>').join(''):'<p class="empty">No events yet.</p>')+'</div>'}
function contact(){stop();app.innerHTML=contactBand('Website inquiry');wireForm()}
/* listings */
const F={single:false,multi:false,history:false,open:false,pmin:'',pmax:'',cmin:'',cmax:''};
function item(l){const info=[l.sold?(l.soldPrice?'Sold: '+M(l.soldPrice):'Sold'):(l.price?'Price: '+l.price:''),l.cap?'Cap Rate: '+l.cap.toFixed(2)+'%':''].filter(Boolean);
  return '<a class="Listings_item" href="#/property/'+E(l.id)+'"><div><div class="Listings_item_image" style="'+(l.photos[0]?'background-image:url(&quot;'+E(l.photos[0])+'&quot;)':'')+'"></div><div class="Listings_item_name">'+E(l.name)+'</div><div class="Listings_item_addr">'+E(l.city+', '+l.state)+'</div></div><div class="Listings_item_body"><div class="Listings_item_name">'+E(l.name)+'</div><div class="Listings_item_addr">'+E(l.city+', '+l.state)+'</div>'+info.map(x=>'<div class="Listings_item_info">'+E(x)+'</div>').join('')+'<div class="Listings_item_more">'+E(l.status)+'</div><div class="Listings_item_more">More info</div></div></a>'}
function listings(){stop();const any=F.single||F.multi;let R=L.filter(l=>F.history?l.sold:!l.sold).filter(l=>!any||(F.single&&l.kind==='single')||(F.multi&&l.kind!=='single'));
  const pmin=+F.pmin||0,pmax=+F.pmax||0,cmin=+F.cmin||0,cmax=+F.cmax||0;R=R.filter(l=>(!pmin||(l.priceNum||0)>=pmin)&&(!pmax||(l.priceNum||0)<=pmax)&&(!cmin||(l.cap||0)>=cmin)&&(!cmax||(l.cap||0)<=cmax));
  R.sort((a,b)=>(b.featured-a.featured)||(a.sold&&b.sold?String(b.soldDate).localeCompare(String(a.soldDate)):0));
  const cards=R.map(item);if(!F.history&&D.team_.joinTile)cards.splice(Math.min(2,cards.length),0,'<a href="#/join" class="Listings_item Listings_item--join"><span class="Listings_item_join_inner"><span>Join</span><span>our</span><span>team!</span></span></a>');
  const cb=(k,l)=>'<label><input type="checkbox" data-f="'+k+'" '+(F[k]?'checked':'')+'>'+l+'</label>';const nm=(k,l,ph)=>'<label>'+l+'<input data-n="'+k+'" placeholder="'+ph+'" value="'+E(F[k])+'" inputmode="decimal"></label>';
  app.innerHTML='<div class="wrap"><div class="ListingsHead"><div class="ListingsHead_title">Listings</div><div class="ListingsHead_toggle"><button type="button" class="ListingsHead_toggle_btn" id="tog">Filter By '+(F.open?'&minus;':'+')+'</button></div><div class="Filter '+(F.open?'on':'')+'"><div class="Filter_types">'+cb('single','Single-Tenant')+cb('multi','Multi-Tenant')+cb('history','Transaction History')+'</div><div class="Filter_nums">'+nm('pmin','Min Price','$')+nm('pmax','Max Price','$')+nm('cmin','Min Cap','%')+nm('cmax','Max Cap','%')+'</div></div></div><div class="Listings"><div class="Listings_list">'+(cards.length?cards.join(''):'<div class="Listings_empty">No listings match these filters.</div>')+'</div></div></div>';
  document.getElementById('tog').onclick=()=>{F.open=!F.open;listings()};app.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{F[c.dataset.f]=c.checked;listings()});
  app.querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{F[i.dataset.n]=i.value.replace(/[^0-9.]/g,'');clearTimeout(listings.t);listings.t=setTimeout(()=>{const k=i.dataset.n;listings();const x=app.querySelector('[data-n="'+k+'"]');x.focus();x.setSelectionRange(x.value.length,x.value.length)},350)})}
function video(u){if(!u)return'';let m=u.match(/(?:youtu\.be\/|v=|\/embed\/)([\w-]{6,})/);if(m)return'<div class="vid"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return'<div class="vid"><iframe src="https://player.vimeo.com/video/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';return''}
function property(id){stop();const l=L.find(x=>x.id===id);if(!l){app.innerHTML='<div class="empty">This listing is no longer available. <a href="#/listings" style="color:var(--green)">See all listings</a></div>';return}
  document.title='STRIVE | '+l.name;const subj=l.name+' - '+l.city+', '+l.state;const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([l.address,l.city,l.state,l.zip].filter(Boolean).join(', '));
  const stats=[l.sold?['Sold:',l.soldPrice?M(l.soldPrice):'']:['Price:',l.price||'Call for offers'],l.sold&&l.soldDate?['Closed:',new Date(l.soldDate+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})]:null,l.noi?['NOI:',M(l.noi)]:null,l.cap?['Cap Rate:',l.cap.toFixed(2)+'%']:null,l.occ!=null?['Occupancy:',l.occ+'%']:null,l.yearBuilt?['Year Built:',l.yearBuilt]:null,l.sf?['Square Feet:',N(l.sf)]:null,l.acres?['Lot Size:',l.acres+' AC']:null,l.units?['Units:',N(l.units)]:null,l.leaseType?['Lease Type:',l.leaseType]:null,l.tenant?['Tenant:',l.tenant]:null].filter(x=>x&&x[1]!=='');
  const hl=l.highlights;const short=hl.slice(0,3);
  app.innerHTML='<div class="Property_head"><div class="Property_head_back"><a href="#/listings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4-6-6 6-6z"/></svg><span>Back to listings</span></a></div>'
   +'<div class="PropertyHero"><div class="PropertyHero_media"><div class="PropertyPhotos_big">'+(l.photos[0]?'<img id="big" src="'+E(l.photos[0])+'" alt="'+E(l.name)+'">':'')+'</div><div class="paginationWrapper">'+(l.photos.length>1?l.photos.map((u,i)=>'<button class="paginationButton '+(i?'':'active')+'" data-u="'+E(u)+'" aria-label="Photo '+(i+1)+'"></button>').join(''):'<button class="paginationButton active"></button>')+'</div>'
   +'<div class="PropertyContactList">'+l.agents.map(a=>'<div class="PropertyContact">'+(a.photo?'<img class="PropertyContact_img" src="'+E(a.photo)+'" alt="">':'<div class="PropertyContact_img"></div>')+'<div><div class="PropertyContact_name">'+E(a.name)+'</div><div class="PropertyContact_phone">'+E(a.phone)+'</div>'+(a.email?'<a class="PropertyContact_btn" href="mailto:'+E(a.email)+'?subject='+encodeURIComponent(subj)+'">Email '+E(a.first||a.name.split(' ')[0])+'</a>':'')+'</div></div>').join('')+'</div></div>'
   +'<div class="PropertyHero_info"><div class="PropertyHead"><div><div class="PropertyHead_body_name">'+E(l.name)+'</div><div class="PropertyHead_body_address"><div>'+E(l.address)+'</div><div>'+E(l.city+', '+l.state+' '+l.zip)+'</div></div></div><a class="PropertyHead_map" href="'+maps+'" target="_blank" rel="noopener">'+PIN+'<span>view map</span></a></div>'
   +'<div class="PropertyHero_status '+(l.status==='Under Contract'||l.status==='In Negotiation'?'uc':'')+'">'+E(l.status)+'</div><div class="PropertyStats">'+stats.map(([k,v])=>'<dl><dt>'+E(k)+'</dt><dd>'+E(v)+'</dd></dl>').join('')+'</div>'
   +(l.om?'<a class="PropertyHero_btn" href="'+E(l.om.url)+'" download="'+E(l.om.name)+'">Download Package</a>':'')+(l.flipbook?'<a class="PropertyHero_btn" href="'+E(l.flipbook)+'" target="_blank" rel="noopener">View Flipbook</a>':'')
   +(hl.length?'<div class="Property_detail_block" style="margin-top:14px"><h2>Highlights</h2><ul>'+short.map(h=>'<li>'+E(h)+'</li>').join('')+'</ul>'+(hl.length>3?'<a class="PropertyHero_btn" href="#more" style="font-size:15px">See More...</a>':'')+'</div>':'')+'</div></div></div>'
   +(hl.length>3||l.description?'<div class="Property_detail" id="more"><div class="Property_detail_block">'+(l.description?'<h2>Overview</h2><p style="margin:0 0 30px;white-space:pre-wrap">'+E(l.description)+'</p>':'')+(hl.length>3?'<h2>Highlights</h2><ul>'+hl.map(h=>'<li>'+E(h)+'</li>').join('')+'</ul>':'')+'</div></div>':'')+video(l.video)+contactBand(subj);
  app.querySelectorAll('.paginationButton[data-u]').forEach(b=>b.onclick=()=>{document.getElementById('big').src=b.dataset.u;app.querySelectorAll('.paginationButton').forEach(x=>x.classList.toggle('active',x===b))});wireForm()}
function route(){const h=location.hash||'#/';const seg=h.slice(2).split('/');const r=seg[0]||'home';const pg=D.nav.find(n=>n.id===r);const type=r==='home'?'home':r==='property'?'property':pg?pg.type:'';document.title='STRIVE | '+(r==='home'?'Commercial Real Estate Advisors':pg?pg.label:r==='property'?'Listing':'STRIVE');
  const lst=(D.nav.find(n=>n.type==='listings')||{}).id,tm=(D.nav.find(n=>n.type==='team')||{}).id;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('cur',a.dataset.r===r||(r==='property'&&a.dataset.r===lst)||(r==='join'&&a.dataset.r===tm)));
  if(type==='home')home();else if(type==='team')team();else if(type==='text')page(r);else if(type==='listings')listings();else if(type==='property')property(decodeURIComponent(seg[1]||''));else if(type==='news')news();else if(type==='events')events();else if(type==='contact')contact();else home();
  if(r==='team'&&seg[1]){const el=document.getElementById('m-'+seg[1]);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),50)}else window.scrollTo(0,0)}
addEventListener('hashchange',route);route()})();
</script></body></html>
